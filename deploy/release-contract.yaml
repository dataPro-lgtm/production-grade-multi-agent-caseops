schema_version: caseops.release-contract.v1
release: v0.6.1
services:
  api:
    image: caseops-api
    startup_probe: /health/startup
    liveness_probe: /health/live
    readiness_probe: /health/ready
    termination_grace_seconds: 30
  a2a:
    image: caseops-a2a
    liveness_probe: /health/live
    termination_grace_seconds: 30
  mcp:
    image: caseops-mcp
    liveness_probe: /health/live
    termination_grace_seconds: 30
state:
  transactional_source_of_truth:
    owner: postgres
    migration_head: "0005"
    backup_format: postgresql-custom
    restore_verification: scripts/restore-drill-chapter-05.sh
slo:
  availability:
    objective: 0.995
    window: 30d
    indicator: successful non-health HTTP requests / all non-health HTTP requests
  latency:
    objective: 0.95
    threshold_seconds: 2
    window: 30d
telemetry:
  propagation: W3C Trace Context
  collector_protocol: OTLP/HTTP
  metric_cardinality_policy: no tenant, case, user, task, or trace identifiers in labels
security:
  tool_policy: caseops.tool-policy.2026-07
  authorization: user scopes intersect workload scopes intersect delegation scopes
  resource_binding: tenant and case
  audit: hashed arguments and context, no raw tool payloads
  red_team_acceptance: scripts/acceptance-chapter-06.sh
