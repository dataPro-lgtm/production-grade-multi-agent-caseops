[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caseops-reference"
version = "1.0.0"
description = "Runnable reference system for Production-Grade Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "a2a-sdk[http-server]>=1.1.2,<2",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.112,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.28,<2",
  "opentelemetry-api>=1.35,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.35,<2",
  "opentelemetry-sdk>=1.35,<2",
  "prometheus-client>=0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
caseops = "caseops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caseops = [
  "py.typed",
  "security/red_team_cases.json",
  "evaluation/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["caseops"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["caseops"]
plugins = ["pydantic.mypy"]
