name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: caseops
          POSTGRES_USER: caseops
          POSTGRES_PASSWORD: caseops-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caseops -d caseops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Unit, integration, and contract tests
        run: pytest --cov=caseops --cov-report=term-missing --cov-report=xml

      - name: Deterministic agent-security red team
        run: python -m caseops.security.red_team --json

      - name: Validate versioned evaluation assets and deterministic graders
        run: |
          python - <<'PY'
          from caseops.evaluation import (
              load_baseline,
              load_dataset,
              load_quality_contract,
          )

          dataset = load_dataset()
          baseline = load_baseline()
          contract = load_quality_contract()
          assert dataset.version == baseline.dataset_version
          assert len(dataset.cases) == 5
          assert sum(case.repetitions for case in dataset.cases) == 13
          assert contract.release_blocking_layers
          print("evaluation assets accepted")
          PY

      - name: Validate PostgreSQL migrations and seed
        env:
          CASEOPS_ENVIRONMENT: test
          CASEOPS_DATABASE_URL: postgresql+psycopg://caseops:caseops-ci@localhost:5432/caseops
          CASEOPS_API_KEYS: '{"ci-only-key":"tenant-demo"}'
        run: |
          alembic upgrade head
          caseops seed
          alembic current

      - name: Static security scan
        run: |
          bandit -q -r src
          pip-audit

      - name: Build runtime image
        run: |
          docker build \
            --tag caseops:${{ github.sha }} \
            --build-arg VERSION=1.0.0 \
            --build-arg VCS_REF=${{ github.sha }} \
            .

      - name: Run live evaluation and AgentOps GameDay gates
        run: |
          docker compose up --build --wait --wait-timeout 120 -d
          PATH="$PWD/.venv/bin:$PATH" make acceptance-chapter-08
          PATH="$PWD/.venv/bin:$PATH" make acceptance-chapter-09
          PATH="$PWD/.venv/bin:$PATH" make acceptance-chapter-10

      - name: Upload evaluation, operations, and release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: caseops-release-evidence-${{ github.sha }}
          path: |
            artifacts/evaluation/chapter-08-report.json
            artifacts/operations/chapter-09-gameday.json
            artifacts/release/
          if-no-files-found: error
          retention-days: 14

      - name: Stop evaluation platform
        if: always()
        run: docker compose down

      - name: Validate Compose platform contract
        run: |
          docker compose \
            -f compose.yaml \
            -f deploy/compose.observability.yaml \
            config --quiet

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/deploy:/etc/caseops:ro" \
            prom/prometheus:v3.12.0 \
            check rules /etc/caseops/caseops.rules.yml
