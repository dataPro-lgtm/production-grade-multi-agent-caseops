name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable vX.Y.Z tag to publish or recover
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/datapro-lgtm/production-grade-multi-agent-caseops

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Verify immutable release identity
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import caseops
          import os

          expected = f"v{caseops.__version__}"
          actual = os.environ["RELEASE_TAG"]
          assert actual == expected, (actual, expected)
          print(f"release identity accepted: {actual}")
          PY
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git status --porcelain)" = ""
          {
            echo "tag=${RELEASE_TAG}"
            echo "number=${RELEASE_TAG#v}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Run code, security, and protocol gates
        run: |
          make verify
          make security
          python -m caseops.security.red_team --json

      - name: Run system, operations, and clean-room gates
        run: |
          docker compose up --build --wait --wait-timeout 120 -d
          make acceptance-chapter-08
          make acceptance-chapter-09
          make acceptance-chapter-10

      - name: Stop acceptance platform
        if: always()
        run: docker compose down

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Define image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.number }}
            type=raw,value=latest

      - name: Build and push immutable release image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.number }}
            VCS_REF=${{ steps.version.outputs.sha }}
          provenance: mode=max
          sbom: true

      - name: Generate SPDX SBOM for the release image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          output-file: ${{ runner.temp }}/caseops-${{ steps.version.outputs.tag }}.spdx.json
          artifact-name: caseops-${{ steps.version.outputs.tag }}.spdx.json
          format: spdx-json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false

      - name: Rebuild release evidence with the registry digest
        run: |
          python -m caseops.release_evidence \
            --source-commit "${{ steps.version.outputs.sha }}" \
            --source-ref "${{ steps.version.outputs.tag }}" \
            --image-name "${{ env.IMAGE_NAME }}" \
            --image-digest "${{ steps.image.outputs.digest }}" \
            --sbom "${RUNNER_TEMP}/caseops-${{ steps.version.outputs.tag }}.spdx.json" \
            --source-date-epoch "$(git show -s --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "caseops-${{ steps.version.outputs.tag }}-release.tar.gz" \
            -C artifacts/release .

      - name: Attest image build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: artifacts/release/caseops-${{ steps.version.outputs.tag }}.spdx.json
          push-to-registry: true

      - name: Attest downloadable release bundle
        uses: actions/attest@v4
        with:
          subject-path: caseops-${{ steps.version.outputs.tag }}-release.tar.gz

      - name: Verify published image attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify \
            "oci://${IMAGE_NAME}:${{ steps.version.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "caseops-${{ steps.version.outputs.tag }}-release.tar.gz" \
            "artifacts/release/caseops-${{ steps.version.outputs.tag }}.spdx.json" \
            artifacts/release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "CaseOps ${{ steps.version.outputs.tag }}"
